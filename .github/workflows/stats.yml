name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"    # daily
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone github-readme-stats
        run: git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs

      - name: Install github-readme-stats deps
        run: npm install --omit=dev --ignore-scripts
        working-directory: /tmp/grs

      # Public data only: the workflow token cannot see private repositories,
      # so nothing private reaches the cards (no PAT on purpose).
      - name: Use the workflow token
        run: echo "PAT_1=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Render stats cards
        env:
          GRS_DIR: /tmp/grs
        run: node scripts/render-stats.mjs

      # Self-hosted trophies: the public github-profile-trophy.deno.dev
      # service is down, so render the same card here, like the stats.
      - name: Render trophies
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        with:
          username: behnamasadi
          output_path: output/trophy.svg
          token: ${{ github.token }}

      - name: Commit stats
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add output/github-stats.svg output/top-langs.svg output/trophy.svg
          git commit -m "Update GitHub Stats" || echo "No changes"
          git push
